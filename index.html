<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PS1 World</title>
    <link rel="stylesheet" href="./styles.css?v=5">
  </head>
  <body class="title-active">
    <canvas id="screen" aria-label="PS1 warehouse test renderer"></canvas>
    <div id="reticule" class="reticule" aria-hidden="true"></div>

    <main id="titleScreen" class="title-screen">
      <div class="title-panel">
        <p class="title-kicker">512i signal</p>
        <h1>ps1-world</h1>
        <button id="startButton" type="button">[start]</button>
      </div>
    </main>

    <div class="hud" aria-hidden="true">
      <div>WASD</div>
      <div>Mouse look</div>
      <div>Space jump</div>
      <div>Shift sprint</div>
      <div>Esc options</div>
    </div>

    <dialog id="options" class="options">
      <form method="dialog">
        <header>
          <h1>Video</h1>
          <button value="close" aria-label="Close options">x</button>
        </header>

        <label>
          <span>Preset</span>
          <select id="preset">
            <option value="portable">Portable TV</option>
            <option value="clean">Cleaner RGB</option>
          </select>
        </label>

        <label>
          <span>Scene</span>
          <select id="scene"></select>
        </label>

        <label>
          <span>Resolution</span>
          <select id="resolution"></select>
        </label>

        <label><input id="scanlines" type="checkbox" checked> Scan lines</label>
        <label><input id="crtDistortion" type="checkbox" checked> CRT distortion</label>
        <label><input id="dither" type="checkbox" checked> Dither</label>
        <label><input id="warping" type="checkbox" checked> Polygon wobble</label>
        <label><input id="colorBleed" type="checkbox" checked> Color bleed</label>
        <label><input id="noise" type="checkbox" checked> RF noise</label>
        <label><input id="showReticule" type="checkbox" checked> Reticule</label>

        <label>
          <span>Pixel scale</span>
          <input id="pixelScale" type="number" min="1" max="6" step="1" value="3" inputmode="numeric">
        </label>

        <label><input id="invertY" type="checkbox"> Invert Y</label>

        <footer>
          <button value="close">Resume</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="./src/app.js?v=25"></script>
  </body>
</html>
