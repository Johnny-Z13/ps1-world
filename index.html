<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PS1 World</title>
    <link rel="stylesheet" href="./styles.css?v=14">
  </head>
  <body class="title-active">
    <canvas id="screen" aria-label="PS1 world renderer"></canvas>
    <div id="reticule" class="reticule" aria-hidden="true"></div>

    <main id="titleScreen" class="title-screen">
      <canvas id="titleCanvas" class="title-canvas" width="512" height="480" aria-hidden="true"></canvas>
      <button id="startButton" class="title-start-hitbox" type="button" aria-label="Free Roam"></button>
      <button id="cutUpButton" class="title-cut-up-hitbox" type="button" aria-label="Cut Up Mode"></button>
      <button id="rogueButton" class="title-rogue-hitbox" type="button" aria-label="Rogue"></button>
    </main>

    <div id="cutUpHud" class="cut-up-hud" aria-live="polite" hidden></div>
    <section id="rogueWinScreen" class="rogue-win-screen" hidden>
      <div class="rogue-win-panel">
        <div class="rogue-win-kicker">ROGUE COMPLETE</div>
        <h1>GAME OVER</h1>
        <p>ALL 9 WORLDS CLEARED</p>
        <button id="rogueReturnButton" type="button">RETURN</button>
      </div>
    </section>
    <div id="lowHealthNotice" class="low-health-notice" aria-live="polite" hidden>Low health</div>

    <div class="hud" aria-hidden="true">
      <div>WASD</div>
      <div>Mouse look</div>
      <div>Space jump</div>
      <div>Shift sprint</div>
      <div>Gamepad</div>
      <div>1-9 scenes</div>
      <div>Esc options</div>
    </div>

    <div id="debugHud" class="debug-hud" hidden aria-hidden="true">
      <div>FPS <span id="debugFps">--</span></div>
      <div>Scene <span id="debugScene">--</span></div>
      <div>Zombies <span id="debugZombies">0</span></div>
      <div>Enemies <span id="debugEnemies">0</span></div>
    </div>

    <div id="touchMove" class="touch-move" aria-hidden="true">
      <div id="touchMoveStick" class="touch-move-stick"></div>
    </div>
    <button id="touchJump" class="touch-jump" type="button" aria-label="Jump">Jump</button>

    <dialog id="options" class="options">
      <form method="dialog">
        <header>
          <h1>Video</h1>
          <button value="close" aria-label="Close options">x</button>
        </header>

        <label>
          <span>Preset</span>
          <select id="preset"></select>
        </label>

        <label>
          <span>Scene</span>
          <select id="scene"></select>
        </label>

        <label>
          <span>Resolution</span>
          <select id="resolution"></select>
        </label>

        <label><input id="scanlines" type="checkbox" checked> Scan lines</label>
        <label><input id="crtDistortion" type="checkbox" checked> CRT distortion</label>
        <label><input id="dither" type="checkbox" checked> Dither</label>
        <label><input id="warping" type="checkbox" checked> Polygon wobble</label>
        <label><input id="colorBleed" type="checkbox" checked> Color bleed</label>
        <label><input id="noise" type="checkbox" checked> RF noise</label>
        <label><input id="playerTorch" type="checkbox" checked> Player torch</label>
        <label><input id="zombies" type="checkbox" checked> Zombies</label>
        <label><input id="debugHudToggle" type="checkbox"> Debug HUD</label>
        <label><input id="showReticule" type="checkbox" checked> Reticule</label>

        <label>
          <span>Pixel scale</span>
          <input id="pixelScale" type="number" min="1" max="6" step="1" value="3" inputmode="numeric">
        </label>

        <label><input id="invertY" type="checkbox"> Invert Y</label>

        <footer>
          <button id="quitGameButton" class="danger" type="button">Quit game</button>
          <button value="close">Resume</button>
        </footer>
      </form>
    </dialog>

    <script type="module" src="./src/app.js?v=148"></script>
  </body>
</html>
